<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60" role="img" aria-label="Universidad Bolivariana de Venezuela - SAHAD">
  <defs>
    <linearGradient id="ubvRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="ubvGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <linearGradient id="ubvBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>

  <!-- Símbolo Institucional UBV: Flama, Libro Abierto y Estrella del Saber -->
  <g transform="translate(6, 6)">
    <!-- Base Libro Abierto -->
    <path d="M 4 38 C 14 34, 22 36, 24 42 C 26 36, 34 34, 44 38 L 44 43 C 34 39, 26 41, 24 46 C 22 41, 14 39, 4 43 Z" fill="url(#ubvBlueGrad)" />
    
    <!-- Alas / Hojas de Conocimiento Izquierda -->
    <path d="M 6 34 C 12 26, 18 20, 23 16 C 21 24, 19 30, 8 36 Z" fill="url(#ubvGoldGrad)" />
    
    <!-- Alas / Hojas de Conocimiento Derecha -->
    <path d="M 42 34 C 36 26, 30 20, 25 16 C 27 24, 29 30, 40 36 Z" fill="url(#ubvGoldGrad)" />
    
    <!-- Llama Central Libertadora -->
    <path d="M 24 6 C 28 14, 32 20, 27 28 C 25 24, 24 22, 24 22 C 24 22, 23 24, 21 28 C 16 20, 20 14, 24 6 Z" fill="url(#ubvRedGrad)" />
    <path d="M 24 13 C 26 17, 28 21, 26 26 C 24.5 24, 24 23, 24 23 C 24 23, 23.5 24, 22 26 C 20 21, 22 17, 24 13 Z" fill="url(#ubvGoldGrad)" opacity="0.95" />

    <!-- Estrella de Cinco Puntas -->
    <polygon points="24,1 25.8,4.8 30,5.4 27,8.2 27.7,12.3 24,10.3 20.3,12.3 21,8.2 18,5.4 22.2,4.8" fill="url(#ubvGoldGrad)" />
  </g>

  <!-- Tipografía Institucional UBV (con colores adaptables y visibles en fondo claro u oscuro) -->
  <g transform="translate(60, 16)">
    <!-- Siglas UBV -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" fill="#C51D24">
      UBV
    </text>
    <text x="56" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5" fill="#1565C0">
      &#8226; SAHAD
    </text>
    <!-- Nombre Completo de la Universidad -->
    <text x="0" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5" letter-spacing="0.4" fill="#374151">
      UNIVERSIDAD BOLIVARIANA DE VENEZUELA
    </text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" letter-spacing="0.3" fill="#6B7280">
      Eje Kerepakupai Vena &#8226; Estado Bolívar
    </text>
  </g>
</svg>
